server:
  udp_address: ":8308"
  http_address: ":8080"

gateway:
  worker_count: 128
  read_buffer_size: 4194304
  write_buffer_size: 4194304
  session_timeout: 180s
  reassembly_timeout: 120s
  ack_timeout: 8s
  max_retries: 4
  max_message_size: 5242880
  # 与 frpc 的 transport.proxyProtocolVersion = "v2" 配套，用于获取客户端真实公网 IP 和端口。
  proxy_protocol_v2: true

storage:
  image_directory: "./storage/images"
  max_image_size: 5242880